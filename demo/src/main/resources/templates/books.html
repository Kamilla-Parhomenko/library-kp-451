<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books | Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <h2>My Library</h2>
    <div>
        <a th:href="@{/library/books}">Books</a>
        <a th:href="@{/library/authors}">Authors</a>
    </div>
</nav>

<main class="container">

    <div class="header">
        <div>
            <h1>Books</h1>
            <p>Manage your book collection</p>
        </div>

        <a class="btn primary" th:href="@{/library/books/add}">
            + Add Book
        </a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Price</th>
                <th>Author</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.genre}"></td>
                <td th:text="${book.price}"></td>
                <td th:text="${book.authorName}"></td>

                <td class="actions">
                    <a class="btn edit"
                       th:href="@{/library/books/{id}/edit(id=${book.id})}">
                        Edit
                    </a>

                    <form th:action="@{/library/books/{id}/delete(id=${book.id})}"
                          method="post">
                        <button class="btn delete"
                                onclick="return confirm('Delete this book?')">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(books)}" class="empty">
            No books found.
        </p>
    </div>

</main>
</body>
</html>
