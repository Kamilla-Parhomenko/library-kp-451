<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <h2>My Library</h2>
    <div>
        <a th:href="@{/library/books}">Books</a>
        <a th:href="@{/library/authors}">Authors</a>
    </div>
</nav>

<main class="container">

    <div class="form-card">
        <h1 th:text="${editMode} ? 'Edit Book' : 'Add Book'"></h1>

        <form th:object="${bookRequest}"
              th:action="${editMode}
                  ? @{/library/books/{id}/edit(id=${bookId})}
                  : @{/library/books/add}"
              method="post">

            <label>Title</label>
            <input type="text" th:field="*{title}"
                   placeholder="Book title">
            <small th:errors="*{title}" class="error"></small>

            <label>Genre</label>
            <input type="text" th:field="*{genre}"
                   placeholder="Book genre">
            <small th:errors="*{genre}" class="error"></small>

            <label>Price</label>
            <input type="number" step="0.01"
                   th:field="*{price}">
            <small th:errors="*{price}" class="error"></small>

            <label>Author</label>
            <select th:field="*{authorId}">
                <option value="">Select Author</option>
                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.fullname}">
                </option>
            </select>
            <small th:errors="*{authorId}" class="error"></small>

            <div class="form-actions">
                <button type="submit" class="btn primary"
                        th:text="${editMode} ? 'Update Book' : 'Save Book'">
                </button>

                <a class="btn secondary"
                   th:href="@{/library/books}">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</main>
</body>
</html>
